name: Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Home.WebUI/package-lock.json

      # Home.WebUI.csproj shells out to `npm run build:css` as a pre-build step, so the
      # packages have to exist before `dotnet build` runs or the whole solution fails.
      - name: Install npm packages
        working-directory: Home.WebUI
        run: npm ci

      - name: Restore
        run: dotnet restore Home.sln

      - name: Build
        run: dotnet build Home.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Home.sln --configuration Release --no-build --verbosity normal
